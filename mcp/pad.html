<!doctype html>

<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>触摸页</title>
<style>
/* 触感空间 · MCP 版的触摸页：整屏一块「纸」，手指下起水纹 / 像皮肤一样陷下去；停手两秒，翻译好的一段话送到本机的 MCP 服务，
   模型下次调用 get_touches 时读到。手机和电脑连同一个 Wi-Fi，用手机浏览器打开这一页。 */
:root {
  --bg: #eef1f2; --ink: #232a2f; --muted: #7b8891; --line: #cfd8dd; --warm: #e9a58f; --blot: #b9cdd8;
  --capsule: rgba(255,255,255,.75); --capsule-fg: #2b3338;
  --font: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14181b; --ink: #e2e7ea; --muted: #8a979f; --line: #2b353b; --warm: #b8604e; --blot: #22333d;
          --capsule: rgba(30,36,40,.75); --capsule-fg: #e2e7ea; color-scheme: dark; }
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-user-select: none; user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.top { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--capsule); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); pointer-events: auto; }
.seg button { font: 500 13px/1 var(--font); color: var(--capsule-fg); background: transparent; border: 0; padding: 8px 12px; border-radius: 999px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.status { font-size: 12px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.last { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); font-size: 12px; line-height: 1.55; color: var(--muted);
        background: var(--capsule); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: 12px; padding: 8px 12px; pointer-events: none; white-space: pre-wrap; }
.last:empty { display: none; }
</style>
</head>
<body>
<canvas id="gl" aria-label="触摸区域"></canvas>
<div class="top">
  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
    <div class="seg" role="group" aria-label="效果">
      <button data-mode="0" aria-pressed="true">水纹</button>
      <button data-mode="1" aria-pressed="false">皮肤</button>
    </div>
    <div class="seg" role="group" aria-label="位置怎么说">
      <button data-map="screen" aria-pressed="true">屏幕</button>
      <button data-map="body" aria-pressed="false">上半身</button>
    </div>
  </div>
  <div class="status" id="status">摸吧，停手两秒就送过去</div>
</div>
<div class="last" id="last"></div>
<script src="translate.js"></script>
<script>
(() => {
'use strict';
const token = new URLSearchParams(location.search).get('t') || '';
const statusEl = document.getElementById('status'), lastEl = document.getElementById('last');
const glCanvas = document.getElementById('gl');
const gl = glCanvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAX_DROPS = 40, MAX_F = 5;
let mode = 0, map = 'screen';

// ---------- 着色器：整页是一张纹理，按手指算每个像素该从哪里取色 ----------
const vs = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
const fs = `
precision highp float;
uniform sampler2D uTex; uniform vec2 uRes; uniform float uTime, uMode, uDpr, uAmp;
uniform vec4 uDrops[${MAX_DROPS}];   // 水纹：x, y, 起始时刻, 强度
uniform vec4 uF[${MAX_F}];           // 皮肤：x, y, 深度, 暖
uniform vec2 uO[${MAX_F}];           // 皮肤：被手指拖着走的位移
uniform vec3 uWarm;
void main(){
  vec2 p = gl_FragCoord.xy, s = p; vec3 add = vec3(0.); float mul = 1., warm = 0.;
  if (uMode < .5) {
    vec2 disp = vec2(0.); float light = 0.;
    for (int i = 0; i < ${MAX_DROPS}; i++) {
      vec4 d = uDrops[i]; float age = uTime - d.z;
      if (d.w <= 0. || age < 0. || age > 1.6) continue;
      float lam = (22. + 18. * age) * uDpr, w = lam * .55;
      vec2 v = p - d.xy; float r = length(v) + .001; float x = r - age * 150. * uDpr;
      float env = exp(-x * x / (w * w)) * exp(-age * 2.2) * d.w / (1. + r / (140. * uDpr));
      env *= smoothstep(0., 16. * uDpr, r);
      float ph = x * 6.2831 / lam; disp += v / r * sin(ph) * env; light += cos(ph) * env;
    }
    s = p - disp * 10. * uDpr * uAmp; add = vec3(light * .06 * uAmp);
  } else {
    vec2 L = normalize(vec2(-.55, .8));
    for (int i = 0; i < ${MAX_F}; i++) {
      vec4 f = uF[i];
      if (abs(f.z) < 1e-4 && dot(uO[i], uO[i]) < 1e-4) continue;
      float R = (34. + 8. * f.w) * uDpr; vec2 v = p - f.xy; float r2 = dot(v, v);
      float fa = exp(-r2 / (R * R)), fb = exp(-r2 / (R * R * 1.6));
      s += v * f.z * .85 * fa * uAmp - uO[i] * fb * uAmp;
      vec2 g = v / R * 2. * f.z * fa;
      add += vec3(dot(g, L) * .16 * uAmp); mul *= 1. - .18 * max(f.z, 0.) * fa; warm += f.w * max(f.z, 0.) * fa;
    }
  }
  vec3 col = texture2D(uTex, clamp(s / uRes, vec2(0.), vec2(1.))).rgb * mul + add;
  gl_FragColor = vec4(mix(col, uWarm, clamp(warm * .16, 0., .32)), 1.);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
let prog, uRes, uTime, uMode, uDpr, uAmp, uDrops, uF, uO, uWarm, tex;
if (gl) {
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  uRes = U('uRes'); uTime = U('uTime'); uMode = U('uMode'); uDpr = U('uDpr'); uAmp = U('uAmp');
  uDrops = U('uDrops'); uF = U('uF'); uO = U('uO'); uWarm = U('uWarm');
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
} else {
  statusEl.textContent = '这个浏览器没有 WebGL：看不到水纹，但摸了照样会送过去';
}

// ---------- 纸：淡水渍 + 细纤维 + 点阵。没有纹理的地方看不出变形 ----------
const src = document.createElement('canvas'), ctx = src.getContext('2d');
let W = 0, H = 0, dpr = 1;
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rgb = hex => { const c = document.createElement('canvas').getContext('2d'); c.fillStyle = hex; const v = c.fillStyle;
  return v[0] === '#' ? [1,3,5].map(i => parseInt(v.slice(i, i + 2), 16) / 255) : v.match(/[\d.]+/g).slice(0, 3).map(x => x / 255); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function drawPaper() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = tok('--bg'); ctx.fillRect(0, 0, W, H);
  const r = rng(7);
  ctx.globalAlpha = .18;
  for (let i = 0; i < 14; i++) { const x = r() * W, y = r() * H, rad = 60 + r() * 160;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, tok('--blot')); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  ctx.globalAlpha = .25; ctx.strokeStyle = tok('--muted'); ctx.lineWidth = .5;
  for (let i = 0; i < 260; i++) { const x = r() * W, y = r() * H, a = r() * Math.PI, l = 6 + r() * 22;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke(); }
  ctx.globalAlpha = .35; ctx.fillStyle = tok('--muted');
  for (let y = 18; y < H; y += 26) for (let x = 18; x < W; x += 26) { ctx.beginPath(); ctx.arc(x, y, .9, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (!gl) return;
  gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
  gl.uniform3fv(uWarm, rgb(tok('--warm')));
}
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  for (const c of [glCanvas, src]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  if (gl) { gl.viewport(0, 0, glCanvas.width, glCanvas.height); gl.uniform2f(uRes, glCanvas.width, glCanvas.height); gl.uniform1f(uDpr, dpr); }
  drawPaper(); wake();
}

// ---------- 画面物理（水纹的滴、皮肤的手指槽） ----------
const t0 = performance.now(), now = () => (performance.now() - t0) / 1000;
const drops = []; let dropHead = 0; const slots = []; const fingers = new Map();
function emitDrop(x, y, amp) { const d = { x, y, t: now(), amp };
  if (drops.length < MAX_DROPS) drops.push(d); else { drops[dropHead] = d; dropHead = (dropHead + 1) % MAX_DROPS; } }
const settled = s => Math.abs(s.depth) < .002 && Math.abs(s.dv) < .01 && Math.hypot(s.ox, s.oy) < .05 && Math.hypot(s.ovx, s.ovy) < .1 && s.warm < .01;
function newSlot(id, x, y) {
  let s = slots.find(s => !s.active && settled(s));
  if (!s) { if (slots.length < MAX_F) { s = { depth: 0, dv: 0, warm: 0 }; slots.push(s); } else s = slots.reduce((a, b) => (a.downAt < b.downAt ? a : b)); }
  Object.assign(s, { id, active: true, downAt: now(), fx: x, fy: y, cx: x, cy: y, gx: x, gy: y, gvx: 0, gvy: 0, ox: 0, oy: 0, ovx: 0, ovy: 0, hold: 0 });
  return s;
}
const ramp = (x, a, b) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function stepSlot(s, h) {
  if (s.active) s.hold += h;
  const hr = ramp(s.hold, .35, 2.6);
  if (s.active) {
    s.cx = s.fx; s.cy = s.fy;
    const k = 40, c = 2 * Math.sqrt(k);   // 皮肤被手指黏着拖
    s.gvx += (k * (s.fx - s.gx) - c * s.gvx) * h; s.gvy += (k * (s.fy - s.gy) - c * s.gvy) * h; s.gx += s.gvx * h; s.gy += s.gvy * h;
    const dx = s.fx - s.gx, dy = s.fy - s.gy, L = Math.hypot(dx, dy), M = 24, f = L > 0 ? M * Math.tanh(L / M) / L : 0;
    s.ox = dx * f; s.oy = dy * f; s.ovx = s.ovy = 0; s.warm += (hr - s.warm) * Math.min(1, h * 1.5);
  } else {
    const k = 110, c = 7;                 // 松手：欠阻尼弹回、晃两下
    s.ovx += (-k * s.ox - c * s.ovx) * h; s.ovy += (-k * s.oy - c * s.ovy) * h; s.ox += s.ovx * h; s.oy += s.ovy * h;
    s.warm -= s.warm * Math.min(1, h * .45);
  }
  const target = s.active ? .55 + .45 * hr : 0;
  s.dv += (220 * (target - s.depth) - 15 * s.dv) * h; s.depth += s.dv * h;
}

// ---------- 渲染：只在有东西在动时跑，静下来一帧都不画 ----------
let running = false, last = 0;
const dropArr = new Float32Array(MAX_DROPS * 4), fArr = new Float32Array(MAX_F * 4), oArr = new Float32Array(MAX_F * 2);
const busy = () => fingers.size > 0 || (mode === 0 ? drops.some(d => now() - d.t < 1.6) : slots.some(s => s.active || !settled(s)));
function wake() { if (!running && gl) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
function frame(ts) {
  const dt = Math.min((ts - last) / 1000, 1 / 20); last = ts;
  const steps = Math.max(1, Math.round(dt * 240));
  if (mode === 1) for (let i = 0; i < steps; i++) for (const s of slots) stepSlot(s, dt / steps);
  draw();
  if (busy()) requestAnimationFrame(frame); else { running = false; draw(); }
}
function draw() {
  dropArr.fill(0); fArr.fill(0); oArr.fill(0);
  drops.forEach((d, i) => dropArr.set([d.x * dpr, (H - d.y) * dpr, d.t, d.amp], i * 4));
  slots.forEach((s, i) => { fArr.set([s.cx * dpr, (H - s.cy) * dpr, s.depth, s.warm], i * 4); oArr.set([s.ox * dpr, -s.oy * dpr], i * 2); });
  gl.uniform1f(uTime, now()); gl.uniform1f(uMode, mode); gl.uniform1f(uAmp, reduced ? .5 : 1);
  gl.uniform4fv(uDrops, dropArr); gl.uniform4fv(uF, fArr); gl.uniform2fv(uO, oArr);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- 震动：网页只能控时长（安卓 Chrome 有，iOS Safari 没有） ----------
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };

// ---------- 记账 + 翻译 + 送出 ----------
let strokes = [], timer = null;
function pressureOf(e) {
  if (e.pointerType === 'pen' && e.pressure > 0) return Math.min(1, e.pressure);
  if (e.pointerType === 'touch' && (e.width > 1 || e.height > 1)) return Math.min(1, Math.max(0, (Math.max(e.width, e.height) / 2 - 12) / 32));
  return 0.3;
}
glCanvas.addEventListener('pointerdown', e => {
  glCanvas.setPointerCapture(e.pointerId);
  clearTimeout(timer); timer = null;
  const x = e.clientX, y = e.clientY, p = pressureOf(e), t = e.timeStamp / 1000;
  const stroke = { samples: [{ x, y, t, p }], start: t, end: t, ended: false };
  strokes.push(stroke);
  const f = { stroke, lx: x, ly: y, lt: now(), ex: x, ey: y, travel: 0 };
  fingers.set(e.pointerId, f);
  if (mode === 0) emitDrop(x, y, 1); else f.slot = newSlot(e.pointerId, x, y);
  buzz(Math.round(8 + 25 * p));            // 按下那一下：越重越长
  statusEl.textContent = `摸着…（${strokes.length} 笔）`;
  wake();
});
glCanvas.addEventListener('pointermove', e => {
  const f = fingers.get(e.pointerId); if (!f) return;
  const x = e.clientX, y = e.clientY, p = pressureOf(e), t = now(), dt = Math.max(t - f.lt, 1 / 240);
  const step = Math.hypot(x - f.lx, y - f.ly), sp = step / dt;
  f.lx = x; f.ly = y; f.lt = t; f.travel += step;
  const lastS = f.stroke.samples[f.stroke.samples.length - 1];
  if (Math.hypot(x - lastS.x, y - lastS.y) >= 1.5) { f.stroke.samples.push({ x, y, t: e.timeStamp / 1000, p }); f.stroke.end = e.timeStamp / 1000; }
  if (mode === 0 && Math.hypot(x - f.ex, y - f.ey) > 22) { emitDrop(x, y, .35 + Math.min(sp / 2200, .5)); f.ex = x; f.ey = y; }
  if (mode === 1 && f.slot && f.slot.id === e.pointerId) { f.slot.fx = x; f.slot.fy = y; }
  if (f.travel > 60) { f.travel = 0; buzz(Math.round(5 + 15 * p)); }   // 抚的时候：每走一段轻敲一下
  wake();
});
const up = e => {
  const f = fingers.get(e.pointerId); if (!f) return;
  f.stroke.end = e.timeStamp / 1000; f.stroke.ended = true;
  if (f.slot && f.slot.id === e.pointerId) f.slot.active = false;
  fingers.delete(e.pointerId);
  if (!fingers.size) { statusEl.textContent = `停手了，两秒后送过去（${strokes.length} 笔）`; timer = setTimeout(send, 2000); }
  wake();
};
glCanvas.addEventListener('pointerup', up); glCanvas.addEventListener('pointercancel', up);

async function send() {
  if (!strokes.length) return;
  const text = TouchTranslate.describe(strokes, { w: W, h: H }, map);
  strokes = [];
  lastEl.textContent = text;
  try {
    const res = await fetch(`api/touch?t=${encodeURIComponent(token)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) });
    statusEl.textContent = res.ok ? '送过去了，它下次看的时候就知道' : (res.status === 401 ? '口令不对：用它给你的链接打开这一页' : `没送出去（${res.status}）`);
    if (res.ok) buzz(12);
  } catch (_) {
    statusEl.textContent = '连不上电脑：确认手机和电脑在同一个 Wi-Fi，服务开着';
  }
}

// ---------- 切换 ----------
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  mode = +b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  drops.length = 0; dropHead = 0; slots.length = 0; wake();
}));
document.querySelectorAll('[data-map]').forEach(b => b.addEventListener('click', () => {
  map = b.dataset.map; document.querySelectorAll('[data-map]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { drawPaper(); wake(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(resize, 120); });
resize();
})();
</script>
</body>
</html>
